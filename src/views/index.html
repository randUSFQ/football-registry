<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Registry - Gestión de Torneos PES</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚽ Football Registry</h1>
            <p class="subtitle">Sistema de Gestión de Torneos de Fútbol Virtual PES</p>
        </header>

        <nav class="tabs">
            <button class="tab-button active" onclick="showTab('players', event)">Jugadores</button>
            <button class="tab-button" onclick="showTab('teams', event)">Equipos</button>
            <button class="tab-button" onclick="showTab('tournaments', event)">Torneos</button>
        </nav>

        <!-- Players Tab -->
        <div id="players" class="tab-content active">
            <div class="section-header">
                <h2>Gestión de Jugadores</h2>
                <button class="btn-primary" onclick="showPlayerForm()">+ Nuevo Jugador</button>
            </div>

            <div id="playerForm" class="form-container" style="display: none;">
                <h3>Registrar Jugador</h3>
                <form onsubmit="createPlayer(event)">
                    <div class="form-group">
                        <label for="playerName">Nombre:</label>
                        <input type="text" id="playerName" required>
                    </div>
                    <div class="form-group">
                        <label for="playerGamertag">Gamertag:</label>
                        <input type="text" id="playerGamertag" required>
                    </div>
                    <div class="form-group">
                        <label for="playerSkill">Nivel:</label>
                        <select id="playerSkill">
                            <option value="beginner">Principiante</option>
                            <option value="intermediate">Intermedio</option>
                            <option value="advanced">Avanzado</option>
                            <option value="pro">Profesional</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Guardar</button>
                        <button type="button" class="btn-secondary" onclick="hidePlayerForm()">Cancelar</button>
                    </div>
                </form>
            </div>

            <div id="playersList" class="list-container"></div>
        </div>

        <!-- Teams Tab -->
        <div id="teams" class="tab-content">
            <div class="section-header">
                <h2>Gestión de Equipos</h2>
                <button class="btn-primary" onclick="showTeamForm()">+ Nuevo Equipo</button>
            </div>

            <div id="teamForm" class="form-container" style="display: none;">
                <h3>Crear Equipo</h3>
                <form onsubmit="createTeam(event)">
                    <div class="form-group">
                        <label for="teamName">Nombre del Equipo:</label>
                        <input type="text" id="teamName" required>
                    </div>
                    <div class="form-group">
                        <label for="teamCaptain">Capitán:</label>
                        <select id="teamCaptain" required>
                            <option value="">Seleccionar jugador...</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Guardar</button>
                        <button type="button" class="btn-secondary" onclick="hideTeamForm()">Cancelar</button>
                    </div>
                </form>
            </div>

            <div id="teamsList" class="list-container"></div>
        </div>

        <!-- Tournaments Tab -->
        <div id="tournaments" class="tab-content">
            <div class="section-header">
                <h2>Gestión de Torneos</h2>
                <button class="btn-primary" onclick="showTournamentForm()">+ Nuevo Torneo</button>
            </div>

            <div id="tournamentForm" class="form-container" style="display: none;">
                <h3>Crear Torneo</h3>
                <form onsubmit="createTournament(event)">
                    <div class="form-group">
                        <label for="tournamentName">Nombre del Torneo:</label>
                        <input type="text" id="tournamentName" required>
                    </div>
                    <div class="form-group">
                        <label for="tournamentType">Tipo:</label>
                        <select id="tournamentType">
                            <option value="single-elimination">Eliminación Directa</option>
                            <option value="round-robin">Todos contra Todos</option>
                            <option value="league">Liga</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="tournamentMaxTeams">Máximo de Equipos:</label>
                        <input type="number" id="tournamentMaxTeams" value="8" min="2" max="32">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Guardar</button>
                        <button type="button" class="btn-secondary" onclick="hideTournamentForm()">Cancelar</button>
                    </div>
                </form>
            </div>

            <div id="tournamentsList" class="list-container"></div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
